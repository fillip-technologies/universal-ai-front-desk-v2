# Development stack: PostgreSQL + backend (auto-reload) + Vite dev server, all
# in containers with source volume-mounted for live editing.
#
# Usage:
#   cp .env.example .env      # then edit as needed
#   docker compose -f docker-compose.dev.yml up --build
#
# Frontend: http://localhost:5173  (proxies /api to the backend container)
# Backend:  http://localhost:8000
# Postgres: localhost:5432        (exposed so you can psql into it)

# Separate project name from the prod stack so the two never share containers.
name: jansunwayi-ai-dev

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-jansunwayi_dev}
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
    ports:
      # Exposed so you can psql into the dev database. Override the host port
      # if you already run PostgreSQL locally on 5432:
      #   POSTGRES_HOST_PORT=5433 docker compose -f docker-compose.dev.yml up
      - "${POSTGRES_HOST_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "psql -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\" -tAc 'select 1' >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backend/app:/app/backend/app
      - ./backend/seed.py:/app/backend/seed.py
    ports:
      - "8000:8000"
    environment:
      # Components, not a pre-built URL — see docker-compose.yml for why.
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-jansunwayi_dev}
      JWT_SECRET: ${JWT_SECRET:-dev-secret-change-me}
      JWT_EXPIRES_DAYS: ${JWT_EXPIRES_DAYS:-7}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@jansunwayi.gov.in}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin12345}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID:-}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN:-}
      TWILIO_PHONE_NUMBER: ${TWILIO_PHONE_NUMBER:-}
      ESCALATION_ENABLED: ${ESCALATION_ENABLED:-true}
      ESCALATION_SWEEP_MINUTES: ${ESCALATION_SWEEP_MINUTES:-15}
      AADHAAR_RELAXED_VALIDATION: ${AADHAAR_RELAXED_VALIDATION:-true}
      CORS_ORIGINS: "http://localhost:5173"
      # Bind mounts from a Windows/macOS host don't deliver inotify events into
      # the container, so --reload would miss edits without polling.
      WATCHFILES_FORCE_POLLING: "true"

  frontend:
    image: node:22-alpine
    working_dir: /app
    command: sh -c "npm ci && npm run dev -- --host 0.0.0.0"
    restart: unless-stopped
    depends_on:
      - backend
    volumes:
      - ./src:/app/src
      - ./index.html:/app/index.html
      - ./public:/app/public
      - ./vite.config.ts:/app/vite.config.ts
      - ./tsconfig.json:/app/tsconfig.json
      - ./package.json:/app/package.json
      - ./package-lock.json:/app/package-lock.json
      - frontend_node_modules:/app/node_modules
    environment:
      VITE_API_PROXY_TARGET: "http://backend:8000"
      CHOKIDAR_USEPOLLING: "true"
    ports:
      - "5173:5173"

volumes:
  postgres_dev_data:
  frontend_node_modules:
